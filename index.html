<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDX TV | Sodexo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261106-2" />
  </head>
  <body>
    <div class="tv-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-bar" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="eyebrow">Canal Corporativo Sodexo</p>
            <h1>SDX <span class="brand-accent">TV</span></h1>
          </div>
        </div>
        <div class="status-wrap">
          <p id="clock" class="clock">--:--:--</p>
          <div class="status-row">
            <p id="date" class="date">--</p>
            <span class="build-version" aria-label="Versão da publicação">build 2026.10.30.1</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="news-status" class="news-status pending">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-text">Aguardando atualização</span>
            </span>
          </div>
        </div>
      </header>

      <main class="content-grid">
        <section class="hero" aria-label="Slides internos">
          <div id="slide-stage" class="slide-stage fade"></div>
          <div class="slide-progress" aria-hidden="true">
            <span id="slide-progress-bar" class="slide-progress-bar"></span>
          </div>
          <div class="hero-meta">
            <div class="meta-text">
              <p id="slide-title" class="slide-title">Carregando conteúdo interno...</p>
              <p id="slide-subtitle" class="slide-subtitle">Modo TV ativo</p>
            </div>
            <p id="slide-counter" class="slide-counter">--/--</p>
          </div>
        </section>

        <aside class="news" aria-label="Notícias externas de SSMA">
          <div class="news-header">
            <div class="news-title-row">
              <span class="news-mark" aria-hidden="true"></span>
              <h2>Radar SSMA</h2>
            </div>
            <p>Saúde, Segurança e Meio Ambiente</p>
          </div>
          <div id="news-stage" class="news-stage">
            <article class="news-card skeleton in">
              <span class="news-tag">Aguarde</span>
              <h3>Buscando fontes oficiais...</h3>
              <p>As notícias aparecerão aqui com atualização automática.</p>
            </article>
          </div>
        </aside>
      </main>
    </div>

    <!-- Versão no query param para evitar cache antigo do JavaScript -->
    <script src="app.js?v=20261029-2"></script>

    <!--
      Keep Awake (TV LG / webOS): vídeo real em loop impede o protetor de tela.
      Não usar Base64 nem 1x1px/opacity 0 — o webOS pausa esses vídeos por otimização de hardware.
      O vídeo é hospedado no próprio projeto (keep-awake-360.mp4, H.264 Main 640x360 25fps + AAC, validado na TV em /keep-awake-test): a URL externa
      usada antes passou a responder 403, e o arquivo 320x180/12fps não decodificava em TVs LG NetCast (tempo preso em 0).
      Script em ES5 por causa do NetCast. A TV tem poucos decodificadores de hardware e só os libera com
      removeAttribute("src") + load(): por isso o keep awake solta o decodificador enquanto um slide de vídeo toca
      e o retoma sozinho depois.
      Diagnóstico na TV: ?debug=1 mostra o estado no canto da tela; /keep-awake-test compara variantes de codificação.
    -->
    <video id="keep-awake-video" autoplay loop muted playsinline preload="auto" aria-hidden="true" tabindex="-1">
      <source src="keep-awake-360.mp4?v=20261106-2" type="video/mp4" />
    </video>

    <script>
      (function keepAwake() {
        var RETRY_PLAY_MS = 2000;
        var WATCHDOG_MS = 15000;
        var AUTO_RELOAD_MS = 14400000; // 4 horas: evita travamento do navegador da TV por falta de RAM
        var retryTimer = null;
        var wakeLock = null;
        var lastError = "";
        var pausedForSlide = false;

        function getVideo() {
          return document.getElementById("keep-awake-video");
        }

        // Outro <video> da página (slide) em reprodução? Em TVs antigas só há um decodificador.
        function slideVideoActive() {
          var all = document.getElementsByTagName("video");
          for (var i = 0; i < all.length; i++) {
            if (all[i].id !== "keep-awake-video" && !all[i].paused && !all[i].ended) return true;
          }
          return false;
        }

        // Libera de fato o decodificador (pausar não basta nessas TVs) e recoloca a fonte quando for retomar.
        // O <video> usa um filho <source>: para soltar o decodificador sem disparar "error", o <source> é
        // retirado e load() é chamado (sem fonte, o elemento esvazia). Para retomar, o <source> volta e load() de novo.
        var released = false;
        var parkedSource = null;
        function releaseDecoder() {
          var video = getVideo();
          if (!video || released) return;
          released = true;
          pausedForSlide = true;
          try { video.pause(); } catch (_) {}
          try {
            parkedSource = video.getElementsByTagName("source")[0] || null;
            if (parkedSource) video.removeChild(parkedSource);
            video.removeAttribute("src");
            video.load();
          } catch (_) {}
        }
        function ensureSource() {
          var video = getVideo();
          if (!video || !released) return;
          released = false;
          try {
            if (parkedSource) video.appendChild(parkedSource);
            video.load();
          } catch (_) {}
        }

        function forcePlay() {
          var video = getVideo();
          if (!video) return;
          if (slideVideoActive()) { releaseDecoder(); return; }
          pausedForSlide = false;
          ensureSource();

          // TVs só liberam autoplay sem interação do controle remoto se o vídeo for mudo e inline.
          video.muted = true;
          video.defaultMuted = true;
          video.setAttribute("muted", "");
          video.setAttribute("playsinline", "");

          var result;
          try {
            result = video.play();
          } catch (err) {
            scheduleRetry();
            return;
          }
          if (result && typeof result.catch === "function") {
            result.catch(function () { scheduleRetry(); });
          }
        }

        function scheduleRetry() {
          if (retryTimer) return;
          retryTimer = window.setTimeout(function () {
            retryTimer = null;
            forcePlay();
          }, RETRY_PLAY_MS);
        }

        // Detecta vídeo "tocando" com o tempo parado (decodificador travado) e reinicia o elemento.
        var lastTime = -1;
        var stuckCount = 0;
        function startWatchdog() {
          window.setInterval(function () {
            var video = getVideo();
            if (!video) return;
            if (slideVideoActive()) { releaseDecoder(); return; }
            if (video.paused || video.ended) { forcePlay(); return; }
            if (video.currentTime === lastTime) {
              stuckCount++;
              if (stuckCount >= 2) {
                lastError = "tempo parado, recarregando @" + new Date().toLocaleTimeString();
                stuckCount = 0;
                try { video.load(); } catch (_) {}
                forcePlay();
              }
            } else {
              stuckCount = 0;
            }
            lastTime = video.currentTime;
          }, WATCHDOG_MS);
        }

        function requestWakeLock() {
          try {
            if (!("wakeLock" in navigator)) return;
            navigator.wakeLock.request("screen").then(function (lock) {
              wakeLock = lock;
              lock.addEventListener("release", function () { wakeLock = null; });
            }, function () { wakeLock = null; });
          } catch (_) {
            wakeLock = null;
          }
        }

        function onVisibilityChange() {
          if (document.visibilityState === "visible") {
            requestWakeLock();
            forcePlay();
          }
        }

        function scheduleAutoReload() {
          window.setTimeout(function () { window.location.reload(); }, AUTO_RELOAD_MS);
        }

        // Se o arquivo falhar (rede, decodificação), recarrega o elemento e tenta de novo.
        function attachRecovery() {
          var video = getVideo();
          if (!video) return;
          video.addEventListener("error", function () {
            var code = video.error && video.error.code;
            lastError = "error code " + code + " @" + new Date().toLocaleTimeString();
            window.setTimeout(function () {
              try { video.load(); } catch (_) {}
              forcePlay();
            }, RETRY_PLAY_MS);
          });
          video.addEventListener("stalled", function () { lastError = "stalled @" + new Date().toLocaleTimeString(); });
          video.addEventListener("pause", function () { if (!released) scheduleRetry(); });
          video.addEventListener("ended", function () { forcePlay(); });

          // Eventos de mídia não borbulham, mas chegam ao document na fase de captura.
          document.addEventListener("play", function (ev) {
            var t = ev.target;
            if (t && t.tagName === "VIDEO" && t.id !== "keep-awake-video") releaseDecoder();
          }, true);
          function onSlideVideoDone(ev) {
            var t = ev.target;
            if (t && t.tagName === "VIDEO" && t.id !== "keep-awake-video") scheduleRetry();
          }
          document.addEventListener("ended", onSlideVideoDone, true);
          document.addEventListener("pause", onSlideVideoDone, true);
          document.addEventListener("emptied", onSlideVideoDone, true);
        }

        // Painel de diagnóstico: index.html?debug=1
        function startDebugPanel() {
          if (!/[?&]debug=1/.test(window.location.search)) return;
          var box = document.createElement("div");
          box.id = "keep-awake-debug";
          box.style.cssText =
            "position:fixed;left:8px;bottom:8px;z-index:99999;padding:6px 10px;font:12px/1.4 monospace;" +
            "color:#0f0;background:rgba(0,0,0,.75);border:1px solid #0f0;white-space:pre;pointer-events:none";
          document.body.appendChild(box);
          var started = new Date().getTime();
          window.setInterval(function () {
            var v = getVideo();
            box.textContent =
              "keep-awake  up " + Math.round((new Date().getTime() - started) / 1000) + "s\n" +
              "video: " + (v ? (v.paused ? (pausedForSlide ? "pausado p/ slide" : "PAUSADO") : "tocando") +
                " t=" + v.currentTime.toFixed(1) + " ready=" + v.readyState + " net=" + v.networkState : "sem elemento") + "\n" +
              "src: " + (v && v.currentSrc ? v.currentSrc.replace(/^.*\//, "") : "-") + "\n" +
              "slide em vídeo: " + (slideVideoActive() ? "sim" : "não") + "\n" +
              "wakeLock: " + (wakeLock ? "ativo" : ("wakeLock" in navigator ? "inativo" : "não suportado")) + "\n" +
              "último erro: " + (lastError || "nenhum") + "\n" +
              "UA: " + navigator.userAgent.slice(0, 60);
          }, 1000);
        }

        var booted = false;
        function boot() {
          forcePlay();
          if (booted) return;
          booted = true;
          attachRecovery();
          startWatchdog();
          requestWakeLock();
          document.addEventListener("visibilitychange", onVisibilityChange);
          scheduleAutoReload();
          startDebugPanel();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
        window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
