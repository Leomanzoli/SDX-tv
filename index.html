<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDX TV | Sodexo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261105-1" />
  </head>
  <body>
    <div class="tv-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-bar" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="eyebrow">Canal Corporativo Sodexo</p>
            <h1>SDX <span class="brand-accent">TV</span></h1>
          </div>
        </div>
        <div class="status-wrap">
          <p id="clock" class="clock">--:--:--</p>
          <div class="status-row">
            <p id="date" class="date">--</p>
            <span class="build-version" aria-label="Versão da publicação">build 2026.10.30.1</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="news-status" class="news-status pending">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-text">Aguardando atualização</span>
            </span>
          </div>
        </div>
      </header>

      <main class="content-grid">
        <section class="hero" aria-label="Slides internos">
          <div id="slide-stage" class="slide-stage fade"></div>
          <div class="slide-progress" aria-hidden="true">
            <span id="slide-progress-bar" class="slide-progress-bar"></span>
          </div>
          <div class="hero-meta">
            <div class="meta-text">
              <p id="slide-title" class="slide-title">Carregando conteúdo interno...</p>
              <p id="slide-subtitle" class="slide-subtitle">Modo TV ativo</p>
            </div>
            <p id="slide-counter" class="slide-counter">--/--</p>
          </div>
        </section>

        <aside class="news" aria-label="Notícias externas de SSMA">
          <div class="news-header">
            <div class="news-title-row">
              <span class="news-mark" aria-hidden="true"></span>
              <h2>Radar SSMA</h2>
            </div>
            <p>Saúde, Segurança e Meio Ambiente</p>
          </div>
          <div id="news-stage" class="news-stage">
            <article class="news-card skeleton in">
              <span class="news-tag">Aguarde</span>
              <h3>Buscando fontes oficiais...</h3>
              <p>As notícias aparecerão aqui com atualização automática.</p>
            </article>
          </div>
        </aside>
      </main>
    </div>

    <!-- Versão no query param para evitar cache antigo do JavaScript -->
    <script src="app.js?v=20261029-2"></script>

    <!--
      Keep Awake (TV LG / webOS): vídeo real em loop impede o protetor de tela.
      Não usar Base64 nem 1x1px/opacity 0 — o webOS pausa esses vídeos por otimização de hardware.
    -->
    <video id="keep-awake-video" autoplay loop muted playsinline preload="auto" aria-hidden="true" tabindex="-1">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4" />
    </video>

    <script>
      (function keepAwake() {
        var RETRY_PLAY_MS = 2000;
        var WATCHDOG_MS = 15000;
        var AUTO_RELOAD_MS = 14400000; // 4 horas: evita travamento do navegador da TV por falta de RAM
        var retryTimer = null;
        var wakeLock = null;

        function getVideo() {
          return document.getElementById("keep-awake-video");
        }

        function forcePlay() {
          var video = getVideo();
          if (!video) return;

          // webOS só libera autoplay sem interação do controle remoto se o vídeo for mudo e inline.
          video.muted = true;
          video.defaultMuted = true;
          video.setAttribute("muted", "");
          video.setAttribute("playsinline", "");

          var result;
          try {
            result = video.play();
          } catch (err) {
            scheduleRetry();
            return;
          }

          if (result && typeof result.catch === "function") {
            result.catch(function () {
              scheduleRetry();
            });
          }
        }

        function scheduleRetry() {
          if (retryTimer) return;
          retryTimer = window.setTimeout(function () {
            retryTimer = null;
            forcePlay();
          }, RETRY_PLAY_MS);
        }

        function startWatchdog() {
          window.setInterval(function () {
            var video = getVideo();
            if (video && (video.paused || video.ended)) forcePlay();
          }, WATCHDOG_MS);
        }

        async function requestWakeLock() {
          try {
            if (!("wakeLock" in navigator)) return;
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", function () {
              wakeLock = null;
            });
          } catch (_) {
            wakeLock = null;
          }
        }

        function onVisibilityChange() {
          if (document.visibilityState === "visible") {
            requestWakeLock();
            forcePlay();
          }
        }

        function scheduleAutoReload() {
          window.setTimeout(function () {
            window.location.reload();
          }, AUTO_RELOAD_MS);
        }

        var booted = false;
        function boot() {
          forcePlay();
          if (booted) return;
          booted = true;
          startWatchdog();
          requestWakeLock();
          document.addEventListener("visibilitychange", onVisibilityChange);
          scheduleAutoReload();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
        window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
