<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDX TV | Sodexo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261106-3" />
  </head>
  <body>
    <div class="tv-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-bar" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="eyebrow">Canal Corporativo Sodexo</p>
            <h1>SDX <span class="brand-accent">TV</span></h1>
          </div>
        </div>
        <div class="status-wrap">
          <p id="clock" class="clock">--:--:--</p>
          <div class="status-row">
            <p id="date" class="date">--</p>
            <span class="build-version" aria-label="Versão da publicação">build 2026.10.30.1</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="news-status" class="news-status pending">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-text">Aguardando atualização</span>
            </span>
          </div>
        </div>
      </header>

      <main class="content-grid">
        <section class="hero" aria-label="Slides internos">
          <div id="slide-stage" class="slide-stage fade"></div>
          <div class="slide-progress" aria-hidden="true">
            <span id="slide-progress-bar" class="slide-progress-bar"></span>
          </div>
          <div class="hero-meta">
            <div class="meta-text">
              <p id="slide-title" class="slide-title">Carregando conteúdo interno...</p>
              <p id="slide-subtitle" class="slide-subtitle">Modo TV ativo</p>
            </div>
            <p id="slide-counter" class="slide-counter">--/--</p>
          </div>
        </section>

        <aside class="news" aria-label="Notícias externas de SSMA">
          <div class="news-header">
            <div class="news-title-row">
              <span class="news-mark" aria-hidden="true"></span>
              <h2>Radar SSMA</h2>
            </div>
            <p>Saúde, Segurança e Meio Ambiente</p>
          </div>
          <div id="news-stage" class="news-stage">
            <article class="news-card skeleton in">
              <span class="news-tag">Aguarde</span>
              <h3>Buscando fontes oficiais...</h3>
              <p>As notícias aparecerão aqui com atualização automática.</p>
            </article>
          </div>
        </aside>
      </main>
    </div>

    <!-- Versão no query param para evitar cache antigo do JavaScript -->
    <script src="app.js?v=20261029-2"></script>

    <!--
      Keep Awake (TV LG NetCast/Colt): um vídeo real em reprodução é o que impede o protetor de tela/espera.
      Aprendido com /keep-awake-test nesta TV (2026-11-06):
      - só há um canal de vídeo e ele é instável: às vezes o <video> fica "tocando" com o tempo preso em 0;
      - o único arquivo que tocou sempre que estava sozinho foi keep-awake.mp4 (320x180, 12fps, baseline + AAC);
      - vídeo totalmente coberto pelo conteúdo não anda: por isso ele fica POR CIMA, com opacidade mínima.
      Estratégia: elemento criado pelo script; se o tempo não avançar, o elemento é destruído e recriado após uma
      pausa. Um registro em localStorage guarda início/último sinal da sessão e se o vídeo andava, para diagnóstico
      (?debug=1 mostra a sessão anterior: serve para saber se a TV dormiu com o vídeo andando).
    -->

    <script>
      (function keepAwake() {
        var SRC = "keep-awake.mp4?v=20261106-1";
        var CHECK_MS = 10000;        // verificação de progresso
        var RECREATE_GAP_MS = 5000;  // pausa entre destruir e recriar (a TV demora a soltar o canal de vídeo)
        var HEARTBEAT_MS = 5000;
        var AUTO_RELOAD_MS = 14400000; // 4 horas
        var HB_KEY = "sdx-keepawake-hb";

        var video = null;
        var released = false;      // solto de propósito (slide em vídeo tocando)
        var recreating = false;
        var recreates = 0;
        var lastTime = 0;
        var stuckChecks = 0;
        var advancing = false;
        var lastError = "";
        var sessionStart = new Date().getTime();
        var prevSession = null;

        function now() { return new Date().getTime(); }
        function hhmm(ms) { var d = new Date(ms); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

        function createVideo() {
          if (video) return;
          var v = document.createElement("video");
          v.id = "keep-awake-video";
          v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("autoplay", ""); v.setAttribute("loop", "");
          v.setAttribute("aria-hidden", "true"); v.tabIndex = -1;
          v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.preload = "auto";
          v.addEventListener("error", function () {
            lastError = "error " + (v.error ? v.error.code : "?") + " @" + hhmm(now());
            scheduleRecreate();
          });
          v.src = SRC;
          document.body.appendChild(v);
          video = v;
          lastTime = 0; stuckChecks = 0;
          play();
        }

        function destroyVideo() {
          if (!video) return;
          var v = video; video = null;
          try { v.pause(); } catch (_) {}
          try { v.removeAttribute("src"); v.load(); } catch (_) {}
          if (v.parentNode) v.parentNode.removeChild(v);
        }

        function play() {
          if (!video) return;
          var r;
          try { r = video.play(); } catch (_) { return; }
          if (r && typeof r.catch === "function") r.catch(function () {});
        }

        function scheduleRecreate() {
          if (recreating || released) return;
          recreating = true;
          destroyVideo();
          window.setTimeout(function () {
            recreating = false;
            if (!released) { recreates++; createVideo(); }
          }, RECREATE_GAP_MS);
        }

        // Outro <video> da página (slide) em reprodução? Só há um canal de vídeo na TV.
        function slideVideoActive() {
          var all = document.getElementsByTagName("video");
          for (var i = 0; i < all.length; i++) {
            if (all[i].id !== "keep-awake-video" && !all[i].paused && !all[i].ended) return true;
          }
          return false;
        }

        function check() {
          if (slideVideoActive()) {
            if (!released) { released = true; destroyVideo(); }
            advancing = false;
            return;
          }
          if (released) {
            released = false;
            window.setTimeout(function () { if (!released && !video) createVideo(); }, RECREATE_GAP_MS);
            return;
          }
          if (!video) { if (!recreating) createVideo(); return; }
          if (video.paused || video.ended) play();
          var t = video.currentTime || 0;
          var progressed = (t - lastTime) > 1 || (lastTime > t && t > 1); // avanço normal ou loop reiniciado
          advancing = progressed;
          lastTime = t;
          if (progressed) { stuckChecks = 0; return; }
          stuckChecks++;
          if (stuckChecks >= 2) {
            lastError = "tempo parado, recriando @" + hhmm(now());
            stuckChecks = 0;
            scheduleRecreate();
          }
        }

        function heartbeat() {
          try {
            localStorage.setItem(HB_KEY, JSON.stringify({
              start: sessionStart, last: now(), advancing: advancing, recreates: recreates, src: SRC
            }));
          } catch (_) {}
        }
        function readPrevSession() {
          try { var raw = localStorage.getItem(HB_KEY); if (raw) prevSession = JSON.parse(raw); } catch (_) {}
        }

        // Painel de diagnóstico: ?debug=1
        function startDebugPanel() {
          if (!/[?&]debug=1/.test(window.location.search)) return;
          var box = document.createElement("div");
          box.id = "keep-awake-debug";
          box.style.cssText =
            "position:fixed;left:8px;bottom:8px;z-index:2147483647;padding:6px 10px;font:12px/1.4 monospace;" +
            "color:#0f0;background:rgba(0,0,0,.75);border:1px solid #0f0;white-space:pre;pointer-events:none";
          document.body.appendChild(box);
          window.setInterval(function () {
            var v = video;
            var prev = "nenhuma";
            if (prevSession && prevSession.start && prevSession.last) {
              prev = hhmm(prevSession.start) + " até " + hhmm(prevSession.last) +
                " (" + Math.round((prevSession.last - prevSession.start) / 60000) + " min), vídeo andava: " +
                (prevSession.advancing ? "SIM" : "NÃO") + ", recriações: " + (prevSession.recreates || 0);
            }
            box.textContent =
              "keep-awake v3  up " + Math.round((now() - sessionStart) / 1000) + "s  início " + hhmm(sessionStart) + "\n" +
              "video: " + (v ? (v.paused ? "PAUSADO" : "tocando") + " t=" + (v.currentTime || 0).toFixed(1) +
                " ready=" + v.readyState + (advancing ? "  ANDANDO" : "  parado") : (released ? "solto p/ slide" : "recriando…")) + "\n" +
              "recriações: " + recreates + "   último evento: " + (lastError || "nenhum") + "\n" +
              "sessão anterior: " + prev + "\n" +
              "UA: " + navigator.userAgent.slice(0, 70);
          }, 1000);
        }

        var booted = false;
        function boot() {
          if (booted) return;
          booted = true;
          readPrevSession();
          createVideo();
          window.setInterval(check, CHECK_MS);
          window.setInterval(heartbeat, HEARTBEAT_MS);
          heartbeat();
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") play();
          });
          window.setTimeout(function () { window.location.reload(); }, AUTO_RELOAD_MS);
          startDebugPanel();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
